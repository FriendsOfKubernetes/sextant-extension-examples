name: Release an example

# Builds one of Sextant's SDK examples at a Sextant commit or tag, signs it and publishes a release for the catalog.
on:
  workflow_dispatch:
    inputs:
      example:
        description: Which example
        type: choice
        options: [hello-page, crd-view]
      sextant_ref:
        description: Sextant commit or tag to build from
        default: main

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.example }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: FriendsOfKubernetes/sextant
          ref: ${{ inputs.sextant_ref }}
          path: .sextant
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .sextant/package-lock.json
      - name: Install the SDK's build tools
        working-directory: .sextant
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and pack
        id: pack
        env:
          EXAMPLE: ${{ inputs.example }}
        run: |
          node .sextant/sdk/scripts/build.mjs ".sextant/sdk/examples/$EXAMPLE" --out "build/$EXAMPLE"
          node .sextant/sdk/scripts/pack.mjs "build/$EXAMPLE" --out out
          id=$(node -p 'require("./build/" + process.env.EXAMPLE + "/sextant-extension.json").id')
          version=$(node -p 'require("./build/" + process.env.EXAMPLE + "/sextant-extension.json").version')
          echo "asset=$id-$version.sextant-ext" >> "$GITHUB_OUTPUT"
          echo "tag=$EXAMPLE-v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C .sextant rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refuse a version that is already released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pack.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG is already released; raise the version in the example's sextant-extension.json"
            exit 1
          fi
      - name: Sign
        env:
          SEXTANT_EXAMPLES_SIGNING_KEY: ${{ secrets.SEXTANT_EXAMPLES_SIGNING_KEY }}
          ASSET: ${{ steps.pack.outputs.asset }}
        run: |
          if [ -z "$SEXTANT_EXAMPLES_SIGNING_KEY" ]; then
            echo "::error::the SEXTANT_EXAMPLES_SIGNING_KEY secret is not set"
            exit 1
          fi
          node .sextant/sdk/scripts/cli.mjs sign "out/$ASSET" --key-env SEXTANT_EXAMPLES_SIGNING_KEY
          node .sextant/sdk/scripts/cli.mjs verify "out/$ASSET" --key keys/sextant-examples.pub
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.pack.outputs.asset }}
          TAG: ${{ steps.pack.outputs.tag }}
          COMMIT: ${{ steps.pack.outputs.commit }}
          EXAMPLE: ${{ inputs.example }}
        run: |
          notes="Built from FriendsOfKubernetes/sextant@$COMMIT (sdk/examples/$EXAMPLE), signed with the key in keys/sextant-examples.pub."
          gh release create "$TAG" "out/$ASSET" "out/$ASSET.minisig" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "$notes"
